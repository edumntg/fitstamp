<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 290px; margin: 0; padding: 14px 16px; color: #1d2226; font: 14px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
    h1 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; justify-content: space-between; }
    ul { list-style: none; margin: 0 0 12px; padding: 0; }
    li { padding: 3px 0; }
    li::before { display: inline-block; width: 20px; content: "○"; color: #9b1c1c; }
    li.done::before { content: "✓"; color: #0b6b3a; }
    li.optional:not(.done)::before { color: #8a929a; }
    .stats { margin: 0 0 12px; color: #5e6b75; font-size: 13px; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; padding: 8px 10px; border: 1px solid #1d2226; border-radius: 999px; background: #1d2226; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.ghost { background: #fff; color: #1d2226; }
    label { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 400; cursor: pointer; }
  </style>
</head>
<body>
  <h1>FitStamp <label><input id="enabled" type="checkbox"> On</label></h1>
  <ul>
    <li id="hasKey">OpenRouter API key</li>
    <li id="hasResume">Resume</li>
    <li id="hasProfile" class="optional">LinkedIn profile (optional)</li>
  </ul>
  <p class="stats" id="stats"></p>
  <div class="row">
    <button id="jobs">Open LinkedIn Jobs</button>
    <button id="settings" class="ghost">Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
